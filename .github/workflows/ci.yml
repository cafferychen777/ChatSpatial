name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release_distributions:
        description: Build and retain the audited wheel and source distribution
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_release_distributions:
        description: Build and retain the audited wheel and source distribution
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-resolution:
    name: Resolve method extras (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Resolve the composable method stack with pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed \
            ".[full,cell-communication,trajectory,spatial-domains]"

      - name: Resolve the isolated FastCCC stack
        if: matrix.python-version == '3.11' || matrix.python-version == '3.12'
        run: python -m pip install --dry-run --ignore-installed ".[fastccc]"

  r-backend-install:
    name: Install R bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5"

      - name: Install and import the R bridge
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[r-backends]"
          python -c "import anndata2ri, rpy2.robjects; print(rpy2.robjects.r('R.version.string')[0])"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install "ruff==0.14.11" "black==25.12.0" "isort==7.0.0"

      - name: Check formatting
        run: |
          black --check chatspatial/ reproducibility/scripts/
          isort --check-only chatspatial/ reproducibility/scripts/
          ruff check chatspatial/ reproducibility/scripts/

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install
        run: uv pip install -e ".[dev,reproducibility]" --system

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify imports
        run: |
          python -c "import chatspatial; print(f'v{chatspatial.__version__}')"
          python -c "from chatspatial.server import mcp; print('MCP OK')"
          python -c "import scanpy, squidpy, leidenalg; print('Core deps OK')"

      - name: Test CLI
        run: python -m chatspatial --help

      - name: Test full default suite
        if: matrix.python-version == '3.12'
        run: python -m pytest

      - name: Verify reproducibility scripts import cleanly
        if: matrix.python-version == '3.12'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: reproducibility/scripts
        run: |
          for script in reproducibility/scripts/*.py; do
            python -c "import runpy; runpy.run_path('${script}', run_name='__smoke__')"
          done

      - name: Test MCP protocol eras
        run: python -m pytest tests/integration/test_mcp_protocol_v2.py

  release-readiness:
    name: Release readiness (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install release environment
        run: uv pip install -e ".[dev,release]" --system

      - name: Rehearse the release gate
        run: scripts/quality/check_release.sh dist

      - name: Store releasable distributions
        if: inputs.build_release_distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
