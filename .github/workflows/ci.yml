name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linters
        run: pip install "ruff==0.14.11" "black==25.12.0" "isort==7.0.0"

      - name: Check formatting
        run: |
          black --check chatspatial/
          isort --check-only chatspatial/
          ruff check chatspatial/

  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9

      - name: Install
        run: uv pip install -e ".[dev]" --system

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify imports
        run: |
          python -c "import chatspatial; print(f'v{chatspatial.__version__}')"
          python -c "from chatspatial.server import mcp; print('MCP OK')"
          python -c "import scanpy, squidpy, leidenalg; print('Core deps OK')"

      - name: Test CLI
        run: python -m chatspatial --help

      - name: Test full default suite
        if: matrix.python-version == '3.12'
        run: python -m pytest

      - name: Test MCP protocol eras
        run: python -m pytest tests/integration/test_mcp_protocol_v2.py
