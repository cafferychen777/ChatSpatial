name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_release_distributions:
        description: Build and retain the audited wheel and source distribution
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_release_distributions:
        description: Build and retain the audited wheel and source distribution
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-resolution:
    name: Resolve method extras
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Resolve every composable method family on Python 3.11-3.14
        run: |
          for python_version in 3.11 3.12 3.13 3.14; do
            for extra in \
              deep-learning velocity trajectory cell-communication fastccc \
              integration spatial-stats deconvolution annotation enrichment \
              cnv differential registration spatial-genes spatial-domains full; do
              echo "Resolving chatspatial[$extra] on Python $python_version"
              uv pip compile pyproject.toml \
                --extra "$extra" \
                --python-version "$python_version" \
                --no-emit-package chatspatial \
                --quiet > /dev/null
            done
          done

  r-backend-install:
    name: Install R bridge
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: "4.5"

      - name: Install and import the R bridge
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[r-backends]"
          python -c "import anndata2ri, rpy2.robjects; print(rpy2.robjects.r('R.version.string')[0])"

  maintained-backend-smoke:
    name: Test maintained backends from wheel
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Build ChatSpatial wheel
        run: |
          python -m pip install build
          python -m build --wheel

      - name: Install wheel with maintained backends in a clean environment
        run: |
          python -m venv /tmp/chatspatial-wheel-smoke
          wheel=$(find "$PWD/dist" -name '*.whl' -print -quit)
          /tmp/chatspatial-wheel-smoke/bin/python -m pip install \
            "${wheel}[spatial-domains,spatial-genes,registration,trajectory,fastccc]"
          /tmp/chatspatial-wheel-smoke/bin/python \
            scripts/quality/smoke_maintained_backends.py

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      # The linter versions are pinned once, in the dev extra. Repeating them
      # here let the two drift apart silently.
      - name: Install linters
        run: uv pip install -e ".[dev]" --system

      - name: Lint
        run: scripts/quality/check_lint.sh

  test:
    name: Python ${{ matrix.python-version }}${{ matrix.os == 'macos-15-intel' && ' (Intel macOS)' || '' }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        # Intel macOS no longer receives new wheels from numba, PyTorch,
        # gseapy, and other compiled dependencies. 3.11 is the only Intel
        # Python with a gseapy wheel; 3.13 is the newest numba supports there.
        # macos-15-intel is GitHub's last x86_64 macOS image (until Aug 2027).
        include:
          - os: macos-15-intel
            python-version: "3.11"
          - os: macos-15-intel
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install
        if: matrix.os != 'macos-15-intel'
        run: uv pip install -e ".[dev,reproducibility]" --system

      # Every compiled dependency must arrive as an x86_64 wheel; a source
      # build that succeeds here (the runner has Rust and compilers) would
      # still fail for most users. The --no-binary packages publish only
      # sdists on every platform (annoy compiles everywhere; the rest are
      # pure Python).
      - name: Install every method extra from wheels (Intel macOS)
        if: matrix.os == 'macos-15-intel'
        run: >-
          uv pip install -e ".[full,dev,reproducibility]" --system
          --only-binary :all:
          --no-binary chatspatial --no-binary annoy --no-binary asciitree
          --no-binary cell2location --no-binary docrep --no-binary fbpca
          --no-binary gypsum-client --no-binary loompy --no-binary pims

      - name: Verify dependency graph
        run: python -m pip check

      - name: Verify imports
        run: |
          python -c "import chatspatial; print(f'v{chatspatial.__version__}')"
          python -c "from chatspatial.server import mcp; print('MCP OK')"
          python -c "import scanpy, squidpy, leidenalg; print('Core deps OK')"

      - name: Verify method imports (Intel macOS)
        if: matrix.os == 'macos-15-intel'
        run: |
          python -c "import SpatialDE, banksy, fastccc, liana, scvelo, palantir, infercnvpy, pydeseq2, harmonypy, bbknn, scanorama, singler, celldex, flashdeconv, paste, ot, esda, libpysal, mllmcelltype, enrichmap; print('Method extras OK')"
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            python -c "import gseapy; print('gseapy', gseapy.__version__)"
          else
            python -c "import cellrank; print('cellrank', cellrank.__version__)"
          fi

      - name: Test CLI
        run: python -m chatspatial --help

      - name: Test full default suite
        if: matrix.python-version == '3.12' || matrix.os == 'macos-15-intel'
        run: python -m pytest

      - name: Verify reproducibility scripts import cleanly
        if: matrix.python-version == '3.12'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONPATH: reproducibility/scripts
        run: |
          for script in reproducibility/scripts/*.py; do
            python -c "import runpy; runpy.run_path('${script}', run_name='__smoke__')"
          done

      - name: Test MCP protocol eras
        run: python -m pytest tests/integration/test_mcp_protocol_v2.py

  release-readiness:
    name: Release readiness (Python 3.11)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install release environment
        run: uv pip install -e ".[dev,release]" --system

      - name: Rehearse the release gate
        run: scripts/quality/check_release.sh dist

      - name: Store releasable distributions
        if: inputs.build_release_distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
