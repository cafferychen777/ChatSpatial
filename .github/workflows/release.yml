name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  provenance:
    name: Verify release provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Verify version and branch provenance
        run: |
          package_version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "$GITHUB_REF_NAME" = "v${package_version}" || {
            echo "Tag $GITHUB_REF_NAME does not match package version v${package_version}" >&2
            exit 1
          }
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "Tag commit $GITHUB_SHA is not part of origin/main" >&2
            exit 1
          }

  quality:
    name: Test and build the tagged release
    needs: provenance
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      build_release_distributions: true

  verify-distributions:
    name: Verify release distributions
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up minimum supported Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Download the tagged release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Re-audit the release distributions
        run: python scripts/quality/audit_distribution.py dist

  draft-release:
    name: Create draft GitHub Release
    needs: verify-distributions
    runs-on: ubuntu-latest
    permissions:
      contents: write # Create the draft GitHub Release and attach distributions.
    steps:
      - name: Download the tagged release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Create draft with verified distributions
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          draft: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          overwrite_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-pypi:
    name: Publish to PyPI
    needs: draft-release
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Exchange GitHub OIDC for a scoped PyPI publishing token.
    steps:
      - name: Download the tagged release distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-github:
    name: Publish GitHub Release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write # Change the verified GitHub Release from draft to public.
    steps:
      - name: Publish GitHub Release
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish-github
    permissions:
      contents: read
      id-token: write # Authenticate the immutable release to the MCP Registry.
    uses: ./.github/workflows/mcp-registry.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish-docker:
    name: Publish Docker image
    needs: publish-github
    permissions:
      contents: read
      packages: write # Pass GHCR publication authority to the Docker workflow.
    uses: ./.github/workflows/docker.yml
