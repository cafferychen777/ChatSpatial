name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        # Run the release gate on the minimum supported Python version so
        # dependency stubs are checked against the same language target.
        python-version: "3.11"
    
    - name: Install uv
      uses: astral-sh/setup-uv@v9.0.0

    - name: Install release toolchain
      run: |
        uv pip install -e ".[dev]" --system
        uv pip install build twine --system

    - name: Verify release tag matches package version
      run: |
        package_version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        test "$GITHUB_REF_NAME" = "v${package_version}" || {
          echo "Tag $GITHUB_REF_NAME does not match package version v${package_version}" >&2
          exit 1
        }

    - name: Run release quality gate
      run: scripts/quality/check_test_gates.sh

    - name: Build package
      run: python3 -m build
    
    - name: Check package
      run: twine check dist/*
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v3.0.2
      with:
        files: dist/*
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
