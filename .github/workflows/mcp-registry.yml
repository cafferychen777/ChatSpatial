name: Publish to MCP Registry

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published GitHub release tag to register
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published GitHub release tag to register (for example, v1.3.5)
        required: true
        type: string

concurrency:
  group: mcp-registry-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  MCP_PUBLISHER_LINUX_AMD64_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc

permissions: {}

jobs:
  verify:
    name: Verify Registry publication
    runs-on: ubuntu-latest
    outputs:
      already_published: ${{ steps.registry.outputs.already_published }}
    permissions:
      contents: read

    steps:
      - name: Checkout the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Verify release identity
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          release_tag = os.environ["RELEASE_TAG"]
          package_version = tomllib.loads(Path("pyproject.toml").read_text())[
              "project"
          ]["version"]
          server = json.loads(Path("server.json").read_text())

          if release_tag != f"v{package_version}":
              raise RuntimeError(
                  f"Release tag {release_tag!r} does not match package version v{package_version}"
              )
          if server["version"] != package_version:
              raise RuntimeError(
                  f"server.json version {server['version']!r} does not match package version {package_version}"
              )
          for package in server["packages"]:
              if package["version"] != package_version:
                  raise RuntimeError(
                      f"Registry package {package['identifier']!r} has version "
                      f"{package['version']!r}, expected {package_version}"
                  )
          PY

          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          test "$is_draft" = "false" || {
            echo "GitHub Release $RELEASE_TAG is not published" >&2
            exit 1
          }

      - name: Check existing Registry state
        id: registry
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from copy import deepcopy
          from pathlib import Path

          def canonical_registry_metadata(metadata):
              canonical = deepcopy(metadata)
              for package in canonical["packages"]:
                  if package.get("registryType") == "pypi":
                      # The Registry validates this publisher hint but omits it
                      # from the immutable public server representation.
                      package.pop("runtime", None)
              return canonical

          server = json.loads(Path("server.json").read_text())
          name = urllib.parse.quote(server["name"], safe="")
          version = urllib.parse.quote(server["version"], safe="")
          url = f"https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{version}"

          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  published = json.load(response)["server"]
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              print(f"MCP Registry does not contain {server['name']} {server['version']}")
              already_published = False
          else:
              published_metadata = canonical_registry_metadata(published)
              expected_metadata = canonical_registry_metadata(server)
              if published_metadata != expected_metadata:
                  raise RuntimeError(
                      "MCP Registry already contains this immutable version with different metadata"
                  )
              print(
                  f"MCP Registry already contains the same canonical "
                  f"{server['name']} {server['version']} metadata"
              )
              already_published = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"already_published={str(already_published).lower()}", file=output)
          PY

  publish:
    name: Publish new Registry version
    needs: verify
    if: needs.verify.outputs.already_published != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Authenticate this release to the MCP Registry.

    steps:
      - name: Checkout the released source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.release_tag }}
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Download verified MCP Publisher
        run: |
          archive=mcp-publisher_linux_amd64.tar.gz
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/${archive}"
          echo "${MCP_PUBLISHER_LINUX_AMD64_SHA256}  ${archive}" > "${archive}.sha256"
          sha256sum -c "${archive}.sha256"
          tar xzf "$archive" mcp-publisher

      - name: Login with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Wait for PyPI package availability
        run: |
          python3 - <<'PY'
          import json
          import sys
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          server = json.loads(Path("server.json").read_text())
          pypi_packages = [
              package
              for package in server["packages"]
              if package.get("registryType") == "pypi"
          ]

          for package in pypi_packages:
              identifier = package["identifier"]
              version = package["version"]
              url = f"https://pypi.org/pypi/{identifier}/{version}/json"
              for attempt in range(1, 31):
                  try:
                      with urllib.request.urlopen(url, timeout=10) as response:
                          if response.status == 200:
                              print(f"Found PyPI package {identifier}=={version}")
                              break
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                  except urllib.error.URLError as error:
                      print(f"PyPI check attempt {attempt} failed: {error}", file=sys.stderr)

                  if attempt == 30:
                      raise RuntimeError(f"PyPI package {identifier}=={version} was not available after waiting")

                  print(f"Waiting for PyPI package {identifier}=={version} (attempt {attempt}/30)")
                  time.sleep(10)
          PY

      - name: Verify the published uvx MCP server
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          uv run --no-project --with 'mcp>=2.0.0,<3.0' python - <<'PY'
          import os

          import anyio
          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client

          version = os.environ["RELEASE_TAG"].removeprefix("v")

          async def verify():
              parameters = StdioServerParameters(
                  command="uvx",
                  args=[
                      "--from",
                      f"chatspatial=={version}",
                      "chatspatial",
                      "server",
                  ],
              )
              with anyio.fail_after(180):
                  async with stdio_client(parameters) as (read, write):
                      async with ClientSession(read, write) as session:
                          initialized = await session.initialize()
                          tools = await session.list_tools()

              if initialized.server_info.version != version:
                  raise RuntimeError(
                      "Published MCP server reported version "
                      f"{initialized.server_info.version!r}, expected {version!r}"
                  )
              if not tools.tools:
                  raise RuntimeError("Published MCP server exposed no tools")
              print(
                  f"Verified ChatSpatial {version} via uvx with "
                  f"{len(tools.tools)} MCP tools"
              )

          anyio.run(verify)
          PY

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
