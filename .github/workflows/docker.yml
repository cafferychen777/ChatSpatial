name: Build and publish Docker image

on:
  workflow_call:
    outputs:
      digest:
        description: Multi-architecture index digest of the ChatSpatial image
        value: ${{ jobs.manifest.outputs.digest }}
      repro-digest:
        description: Multi-architecture index digest of the reproduction image
        value: ${{ jobs.manifest.outputs.repro-digest }}
  workflow_dispatch:

permissions: {}

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/chatspatial
  # The same image is mirrored to Docker Hub. The namespace defaults to the
  # maintainer's Docker Hub account; set the DOCKERHUB_NAMESPACE repository
  # variable to publish elsewhere. Needs the DOCKERHUB_USERNAME and
  # DOCKERHUB_TOKEN secrets (a Docker Hub access token with write scope).
  DOCKERHUB_IMAGE: docker.io/${{ vars.DOCKERHUB_NAMESPACE || 'cafferychen777' }}/chatspatial
  # Location of the reproduction input archive baked into the -repro image.
  REPRO_DATA_URL: ${{ vars.REPRO_DATA_URL }}

jobs:
  # One runner per architecture. Building both platforms on an amd64 runner
  # meant the arm64 half ran under QEMU, which dominated the release: 1205s of
  # a 1617s pipeline. arm64 runners are free for public repositories, so each
  # architecture is built natively and the two are joined into one manifest.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write # Push the per-architecture layer to GHCR by digest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    outputs:
      digest-amd64: ${{ steps.expose.outputs.digest-amd64 }}
      digest-arm64: ${{ steps.expose.outputs.digest-arm64 }}
      repro-digest-amd64: ${{ steps.expose.outputs.repro-digest-amd64 }}
      repro-digest-arm64: ${{ steps.expose.outputs.repro-digest-arm64 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Layers survive between releases, so a release that only changes
          # Python source reuses the compiled dependency layer.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      # The reproduction image (manuscript key results) is layered on the
      # exact base digest just pushed, and published as the -repro tag.
      - name: Build and push the reproduction image by digest
        id: repro
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: reproducibility
          file: reproducibility/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
            REPRO_DATA_URL=${{ env.REPRO_DATA_URL }}
          cache-from: type=gha,scope=repro-${{ matrix.arch }}
          cache-to: type=gha,scope=repro-${{ matrix.arch }},mode=max
          outputs: type=image,"name=${{ env.IMAGE }},${{ env.DOCKERHUB_IMAGE }}",push-by-digest=true,name-canonical=true,push=true

      - name: Expose the digests for this architecture
        id: expose
        run: |
          echo "digest-${{ matrix.arch }}=${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"
          echo "repro-digest-${{ matrix.arch }}=${{ steps.repro.outputs.digest }}" >> "$GITHUB_OUTPUT"

  manifest:
    name: Publish multi-architecture manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Create the tagged manifest that references both digests.
    outputs:
      digest: ${{ steps.digests.outputs.digest }}
      repro-digest: ${{ steps.digests.outputs.repro-digest }}
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Extract reproduction image metadata
        id: meta-repro
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          flavor: |
            latest=false
            suffix=-repro
          tags: |
            type=raw,value=repro,suffix=,enable=${{ github.ref_type == 'tag' }}
            type=ref,event=tag
            type=sha,prefix=sha-

      - name: Create and push the manifest
        env:
          AMD64: ${{ needs.build.outputs.digest-amd64 }}
          ARM64: ${{ needs.build.outputs.digest-arm64 }}
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          tags=$(jq -r '.tags | map("--tag " + .) | join(" ")' <<<'${{ steps.meta.outputs.json }}')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"

      - name: Create and push the reproduction manifest
        env:
          AMD64: ${{ needs.build.outputs.repro-digest-amd64 }}
          ARM64: ${{ needs.build.outputs.repro-digest-arm64 }}
        run: |
          test -n "$AMD64" && test -n "$ARM64"
          tags=$(jq -r '.tags | map("--tag " + .) | join(" ")' <<<'${{ steps.meta-repro.outputs.json }}')
          # shellcheck disable=SC2086
          docker buildx imagetools create $tags \
            "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"

      - name: Verify the published manifest
        run: |
          tag=$(jq -r '.tags[0]' <<<'${{ steps.meta.outputs.json }}')
          # buildx also attaches provenance and SBOM entries, which carry the
          # platform "unknown/unknown". The question is whether both
          # architectures are served, not whether anything else rides along.
          docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform | "\(.os)/\(.architecture)"] as $p
                     | ($p | index("linux/amd64")) and ($p | index("linux/arm64"))'

      # Both registries must serve the identical index, so one digest can be
      # cited for either pull command.
      - name: Record digest-pinned pull commands
        id: digests
        run: |
          set -euo pipefail
          tag=$(jq -r '.tags[] | select(startswith("ghcr.io/"))' <<<'${{ steps.meta.outputs.json }}' | head -n1)
          rtag=$(jq -r '.tags[] | select(startswith("ghcr.io/"))' <<<'${{ steps.meta-repro.outputs.json }}' | head -n1)
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -r .digest; }
          d=$(digest "$tag"); dh=$(digest "${DOCKERHUB_IMAGE}:${tag##*:}")
          r=$(digest "$rtag"); rh=$(digest "${DOCKERHUB_IMAGE}:${rtag##*:}")
          test "$d" = "$dh" && test "$r" = "$rh"
          echo "digest=$d" >> "$GITHUB_OUTPUT"
          echo "repro-digest=$r" >> "$GITHUB_OUTPUT"
          {
            echo "### Digest-pinned pull commands"
            echo '```'
            echo "docker pull ${DOCKERHUB_IMAGE#docker.io/}@$d"
            echo "docker pull ${IMAGE}@$d"
            echo "docker pull ${DOCKERHUB_IMAGE#docker.io/}@$r   # reproduction image"
            echo "docker pull ${IMAGE}@$r   # reproduction image"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
